<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZELO - Remédios</title>

    <link rel="stylesheet" href="css/medicamentos-familiar.css">
    <link rel="stylesheet" href="../assistente/assistente.css">

    <script src="../assistente/zelo-sync.js"></script>
</head>

<body>

<div class="wrapper">

    <!-- =====================================================
         SIDEBAR
         ===================================================== -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="zelo2.png" alt="Zelo Logo">
        </div>

        <nav class="sidebar-nav">
            <ul>
                <li>
                    <a href="home-familiar.html">
                        INÍCIO
                    </a>
                </li>
                <li>
                    <a href="medicamentos-familiar.html" class="active">
                        REMÉDIOS
                    </a>
                </li>
                <li>
                    <a href="../lembretefamilia/lembretesfamiliar.html">
                        LEMBRETES
                    </a>
                </li>
                <li>
                    <a href="../compromissofamilia/compromissosfamiliar.html">
                        COMPROMISSOS
                    </a>
                </li>
            </ul>
        </nav>

        <div class="sidebar-footer">
            <a href="#" onclick="irParaPerfilIdoso(event)">
                <span class="icon">👤</span>
                PERFIL IDOSO
            </a>

            <a href="#" onclick="sair(event)">
                <span class="icon">➡️</span>
                SAIR
            </a>
        </div>
    </aside>

    <!-- =====================================================
         CONTEÚDO PRINCIPAL
         ===================================================== -->
    <main class="main-content">

        <header class="top-header">

            <!-- SININHO DE NOTIFICAÇÕES -->
            <div class="notif-wrapper">
                <button id="btn-sininho" class="bell-btn" title="Notificações">
                    🔔
                    <span id="notif-badge" class="notif-badge" style="display:none;">0</span>
                </button>

                <div id="notif-dropdown" class="notif-dropdown">
                    <div class="notif-header">
                        <h3>Notificações do Idoso</h3>
                        <button id="btn-limpar-notif" class="notif-clear-btn">Limpar</button>
                    </div>

                    <div id="notif-lista" class="notif-list">
                        <p class="notif-empty">Nenhuma notificação no momento.</p>
                    </div>
                </div>
            </div>

            <!-- USUÁRIO LOGADO -->
            <div class="user-pill">
                <div class="user-info">
                    <span>
                        Olá, <strong id="nome-familiar">usuário!</strong>
                    </span>
                    <small id="idoso-label">
                        Idoso: carregando...
                    </small>
                </div>

                <div class="user-avatar" id="avatar-container">
                    👤
                </div>
            </div>

        </header>

        <!-- ALERTA DE FEEDBACK DA API -->
        <div id="responseMessage" class="alert hidden" style="margin-bottom: 20px;"></div>

        <!-- =====================================================
             AÇÕES / BOTÕES PRINCIPAIS
             ===================================================== -->
        <div class="actions-list">

            <div class="info-pill">
                <span class="icon">💊</span>
                <p>
                    Aqui você pode gerenciar remédios do idoso:
                    <strong id="nome-idoso">Carregando...</strong>
                </p>
            </div>

            <!-- ADICIONAR REMÉDIO -->
            <button class="btn-action" id="btn-adicionar">
                <div class="btn-left">
                    <span class="btn-icon">⊕</span>
                    <span class="btn-text">Adicionar remédio</span>
                </div>
                <span class="btn-arrow">❯</span>
            </button>

            <!-- REMOVEDOR DE REMÉDIO -->
            <button class="btn-action" id="btn-remover">
                <div class="btn-left">
                    <span class="btn-icon">⊖</span>
                    <span class="btn-text">Remover remédio</span>
                </div>
                <span class="btn-arrow">❯</span>
            </button>

            <!-- COR DA GAVETA -->
            <button class="btn-action" id="btn-cor-gaveta">
                <div class="btn-left">
                    <span class="btn-icon">📂</span>
                    <span class="btn-text">Definir cor de gaveta</span>
                </div>
                <span class="btn-arrow">❯</span>
            </button>

            <!-- LISTA DE REMÉDIOS -->
            <button class="btn-action" id="btn-lista">
                <div class="btn-left">
                    <span class="btn-icon">📚</span>
                    <span class="btn-text">Ver lista de remédios</span>
                </div>
                <span class="btn-arrow">❯</span>
            </button>

        </div>

    </main>

</div>

<!-- JAVASCRIPT -->
<script type="module" src="js/medicamentos-familiar.js"></script>
<script src="../assistente/assistente.js"></script>

</body>
</html>
