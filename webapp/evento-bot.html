<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Eventos</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    .btn { padding: 15px 20px; border-radius: 8px; font-size: 18px; border: none; cursor: pointer; width: 100%; margin-top: 10px; }
    .btn-green { background: #28a745; color: white; }
    .btn-blue { background: #007bff; color: white; }
  </style>
</head>
<body>

  <div id="divAtivar">
    <h3>📅 Alertas de Eventos e Compromissos</h3>
    <button class="btn btn-green" onclick="ativar()">🚀 Ativar</button>
  </div>

  <div id="divConcluido" style="display: none;">
    <h3>✅ Eventos Ativados com Sucesso!</h3>
    <button class="btn btn-blue" onclick="voltarParaCentral()">⬅️ Voltar para a Central</button>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || '';
    const isAtivado = urlParams.get('ativado') === 'true';
    const hubUsername = urlParams.get('hubUsername') || 'ConnectHubSpoke_bot';

    if (isAtivado) {
      document.getElementById('divAtivar').style.display = 'none';
      document.getElementById('divConcluido').style.display = 'block';
    }

    function ativar() {
      const targetUrl = `https://t.me/NotificaEventoBot?start=${encodeURIComponent(token)}`;
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(targetUrl);
      } else {
        window.location.href = targetUrl;
      }
    }

    function voltarParaCentral() {
      const tokenComTag = token ? `${token}_EVT` : '';
      const linkCentral = tokenComTag 
        ? `https://t.me/${hubUsername}?start=${encodeURIComponent(tokenComTag)}`
        : `https://t.me/${hubUsername}`;

      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(linkCentral);
      } else {
        window.location.href = linkCentral;
      }
    }
  </script>
</body>
</html>
