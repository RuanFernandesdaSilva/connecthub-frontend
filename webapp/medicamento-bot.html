<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Medicamentos</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      text-align: center; 
      padding: 20px; 
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    .btn { 
      padding: 15px 20px; 
      border-radius: 8px; 
      font-size: 18px; 
      font-weight: bold;
      border: none; 
      cursor: pointer; 
      width: 100%; 
      margin-top: 15px; 
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .btn-green { background: #28a745; color: white; }
    .btn-blue { background: #007bff; color: white; }
    h3 { margin-top: 10px; }
  </style>
</head>
<body>

  <div id="divAtivar">
    <h3>💊 Alertas de Remédios</h3>
    <p>Clique no botão abaixo para ativar suas notificações de medicação no Telegram.</p>
    <button class="btn btn-green" onclick="ativar()">🚀 Ativar Notificações</button>
  </div>

  <div id="divConcluido" style="display: none;">
    <h3>✅ Remédios Ativados com Sucesso!</h3>
    <p>Seus alertas foram vinculados. Você pode retornar ao Telegram agora.</p>
    <button class="btn btn-blue" onclick="voltarParaCentral()">⬅️ Voltar para o Chat</button>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || '';
    const isAtivado = urlParams.get('ativado') === 'true';
    const hubUsername = urlParams.get('hubUsername') || 'ConnectHubSpoke_bot';
    const medUsername = urlParams.get('medUsername') || 'NotificaMedBot';

    if (isAtivado) {
      document.getElementById('divAtivar').style.display = 'none';
      document.getElementById('divConcluido').style.display = 'block';
    }

    function ativar() {
      const targetUrl = `https://t.me/${medUsername}?start=${encodeURIComponent(token)}`;
      
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(targetUrl);
      } else {
        window.location.href = targetUrl;
      }
    }

    function voltarParaCentral() {
      // Se estiver dentro do WebApp do Telegram, fecha a janela do WebApp para retornar ao chat
      if (tg && tg.close) {
        tg.close();
      } else {
        // Fallback caso seja aberto via navegador comum
        const tokenComTag = token ? `${token}_MED` : '';
        const linkCentral = tokenComTag 
          ? `https://t.me/${hubUsername}?start=${encodeURIComponent(tokenComTag)}`
          : `https://t.me/${hubUsername}`;
        window.location.href = linkCentral;
      }
    }
  </script>
</body>
</html>
